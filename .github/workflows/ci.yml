name: C++ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure project
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DENABLE_WARNINGS_AS_ERRORS=ON

      - name: Check source formatting
        run: cmake --build build-release --target format-check

      - name: Build project
        run: cmake --build build-release

      - name: Run tests
        run: ctest --test-dir build-release --output-on-failure

      - name: Run scripted CLI demo
        run: |
          timeout 10s ./build-release/TelecomSimulator < examples/demo-input.txt > build-release/demo-output.txt
          cat build-release/demo-output.txt
          grep -Fq 'User is busy' build-release/demo-output.txt
          grep -Fq '101 | caller=1 | receiver=2 | Ended' build-release/demo-output.txt
          grep -Fq '102 | caller=1 | receiver=3 | Created' build-release/demo-output.txt
          if grep -Fq 'Could not end call' build-release/demo-output.txt; then
            exit 1
          fi

  sanitizers:
    name: Debug with ASan and UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure project
        run: cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DENABLE_WARNINGS_AS_ERRORS=ON -DENABLE_ADDRESS_SANITIZER=ON -DENABLE_UNDEFINED_BEHAVIOR_SANITIZER=ON

      - name: Build project
        run: cmake --build build-sanitizers

      - name: Run tests
        run: ctest --test-dir build-sanitizers --output-on-failure

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Configure project
        run: >
          cmake -S . -B build-tidy
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_CLANG_TIDY=ON
          -DENABLE_WARNINGS_AS_ERRORS=ON

      - name: Build with clang-tidy
        run: cmake --build build-tidy

      - name: Run tests
        run: ctest --test-dir build-tidy --output-on-failure
